<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026大阪●京都●兵庫</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdf6f0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;700&display=swap');
        
        :root {
            --jp-red: #bc002d;
            --jp-pink: #f2e1e1;
            --jp-blue: #8eaccd;
            --jp-green: #a7d2cb;
            --jp-bg: #fdf6f0;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--jp-bg);
            color: #443f3f;
            -webkit-tap-highlight-color: transparent;
        }

        .serif { font-family: 'Noto Serif TC', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 分類色彩標籤 */
        .tag-sight { background: #e0f2fe; color: #0369a1; }
        .tag-food { background: #fef2f2; color: #b91c1c; }
        .tag-transport { background: #f0fdf4; color: #15803d; }
        .tag-stay { background: #faf5ff; color: #7e22ce; }

        .highlight-feature { color: #d97706; font-weight: bold; }
        .highlight-must { background-color: #fef3c7; border-bottom: 2px solid #f59e0b; padding: 0 2px; }
        
        .bottom-nav { border-radius: 24px 24px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- PDF 資料匯入 ---
        const TRIP_DATA = [
            {
                date: "2026/02/02 (一)",
                location: "大阪/難波",
                items: [
                    { time: "06:30", type: "transport", title: "機場捷運(台北車站)", desc: "計程車/現金。時刻表見備註。", note: "機場捷運時刻表查詢：https://www.tymetro.com.tw/", maps: "https://maps.app.goo.gl/MW7Zr3WvPaUYwd537" },
                    { time: "09:20", type: "transport", title: "星宇航空 JX822", desc: "前往關西機場(KIX)。領完行李前往臨空城。", note: "報到後進第二航廈貴賓室享用早餐。", maps: "https://maps.app.goo.gl/JLbrA5JiHkfwz835A" },
                    { time: "14:00", type: "sight", title: "臨空城 Outlet", desc: "特色重點：關西最大級，面海設計。必買/體驗：西松屋(嬰幼兒)、Onitsuka Tiger(日本限定色)、Nike/Adidas。", note: "行李寄放或suica搭乘南海電鐵。", maps: "https://maps.app.goo.gl/ScyV1p9Va6UDRcrW8" },
                    { time: "19:25", type: "stay", title: "GRIDS PREMIUM HOTEL OSAKA NAMBA", desc: "住宿 check-in。搭乘南海電鐵特急Rapi:t。", note: "需窗口買票不可直刷。", maps: "https://maps.app.goo.gl/BYcsfakHzt5pYJwi9" },
                    { time: "19:30", type: "food", title: "大起水產 迴轉壽司", desc: "必吃/體驗：黑鮪魚赤身、炙燒鮭魚肚、茶碗蒸(日本版超嫩)。", note: "道頓堀店，吃完可逛藥妝。", maps: "https://maps.app.goo.gl/4ZijhBKwhh4oWKmt6" }
                ]
            },
            {
                date: "2026/02/03 (二)",
                location: "伊根/天橋立",
                items: [
                    { time: "07:15", type: "transport", title: "KKDAY一日遊出發", desc: "特色重點：集合地點為蟹道樂道頓堀東店。", note: "提早15分鐘出門，早餐可帶車上吃。", maps: "https://maps.app.goo.gl/wGSZwfghYPAUpq727" },
                    { time: "10:00", type: "sight", title: "伊根灣遊覽船", desc: "特色重點：日本「舟屋」代表，冬季海色偏深藍。必吃/體驗：餵海鷗。", note: "約停留45分鐘。", maps: "https://maps.app.goo.gl/M1y4cYrxukxZw9AAA" },
                    { time: "11:00", type: "sight", title: "天橋立傘松公園", desc: "特色重點：日本三景之一，「倒頭栽」視角。必吃/體驗：智惠團子、抹茶套餐。", note: "約停留1小時。", maps: "https://maps.app.goo.gl/Q2G1kdLTxYXpqwgE6" },
                    { time: "14:45", type: "sight", title: "美山茅草屋之里", desc: "特色重點：日本保存最完整聚落。必吃/體驗：手工米果、美山牛乳甜點。", note: "冬季積雪如明信片。", maps: "https://maps.app.goo.gl/TGn1n7bdZyGeb33a6" },
                    { time: "19:40", type: "stay", title: "Hotel Hankyu RESPIRE OSAKA", desc: "搬家至梅田住宿。 suica 搭乘地鐵。", note: "難波站 -> 梅田站。", maps: "https://maps.app.goo.gl/LSLKXtng8oKr4Q4QA" }
                ]
            },
            {
                date: "2026/02/04 (三)",
                location: "梅田/貴船",
                items: [
                    { time: "09:00", type: "sight", title: "梅田周邊逛街", desc: "特色重點：yodobashi、uniqlo。", note: "自由活動時間。" },
                    { time: "14:40", type: "sight", title: "貴船神社", desc: "特色重點：最夢幻神社、燈籠石階。必吃/體驗：水占卜(みずみくじ)。", note: "冬季夜間點燈氣氛滿分。", maps: "https://maps.app.goo.gl/2SeLPrBbPPCxQV1p9" },
                    { time: "20:30", type: "food", title: "燒肉力丸 梅田東通店", desc: "特色重點：人氣吃到飽、肉質穩定。必吃/體驗：鹽蔥牛舌、和牛肩胛。", note: "已預約20:30。", maps: "https://maps.app.goo.gl/mSRk6AkBcJV6ta7TA" }
                ]
            },
            {
                date: "2026/02/05 (四)",
                location: "勝尾寺/姬路城",
                items: [
                    { time: "09:30", type: "sight", title: "勝尾寺", desc: "特色重點：遍地達摩壯觀，適合祈求勝利。必吃/體驗：小達摩、勝運御守。", note: "門票500日圓。", maps: "https://maps.app.goo.gl/au2qs1mkMEeMs66b8" },
                    { time: "13:35", type: "sight", title: "姬路城", desc: "特色重點：日本第一名城，世界遺產「白鷺城」。必吃/體驗：白色布丁、姬路關東煮。", note: "門票1000日圓。", maps: "https://maps.app.goo.gl/GeWsaaQig2eerPim9" }
                ]
            },
            {
                date: "2026/02/06 (五)",
                location: "關西機場/返家",
                items: [
                    { time: "09:00", type: "transport", title: "關西機場貴賓室", desc: "特色重點：休息等待登機。", note: "KKDAY機場接送。", maps: "https://maps.app.goo.gl/JLbrA5JiHkfwz835A" },
                    { time: "12:20", type: "transport", title: "星宇航空 JX821", desc: "返回桃園機場(TPE)。", note: "預計14:35抵達。", maps: "https://maps.app.goo.gl/wEwQpbYUt7wF14Vf8" }
                ]
            }
        ];

        // --- 子組件：行程卡片 ---
        const ItineraryCard = ({ item }) => {
            const formatText = (text) => {
                if (!text) return "";
                let parts = text.split(/(特色重點：|必吃\/體驗：|必買\/體驗：|必吃：|必買：)/g);
                return parts.map((part, i) => {
                    if (part.includes("特色重點")) return <span key={i} className="highlight-feature">{part}</span>;
                    if (part.includes("必吃") || part.includes("必買")) return <span key={i} className="highlight-must">{part}</span>;
                    return part;
                });
            };

            return (
                <div className="glass-card p-4 mb-4 shadow-sm border-l-4 border-l-[#8eaccd]">
                    <div className="flex justify-between items-center mb-2">
                        <span className="text-sm font-bold bg-gray-100 px-2 py-0.5 rounded text-gray-500">{item.time}</span>
                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider ${
                            item.type === 'sight' ? 'tag-sight' : 
                            item.type === 'food' ? 'tag-food' : 
                            item.type === 'stay' ? 'tag-stay' : 'tag-transport'
                        }`}>
                            {item.type}
                        </span>
                    </div>
                    <h3 className="serif text-lg font-bold mb-2">{item.title}</h3>
                    <p className="text-sm text-gray-600 leading-relaxed mb-3">
                        {formatText(item.desc)}
                    </p>
                    {item.note && (
                        <div className="bg-orange-50/50 p-2 rounded text-xs text-orange-800 mb-3 italic">
                            💡 備註：{item.note}
                        </div>
                    )}
                    {item.maps && (
                        <a href={item.maps} target="_blank" className="inline-flex items-center text-xs font-bold text-blue-600 bg-blue-50 px-3 py-2 rounded-lg">
                            <i data-lucide="map-pin" className="w-3 h-3 mr-1"></i> Google Maps 導航
                        </a>
                    )}
                </div>
            );
        };

        // --- 主程式 ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('itinerary');
            const [activeDay, setActiveDay] = useState(0);

            useEffect(() => { lucide.createIcons(); }, [activeTab, activeDay]);

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="p-6 bg-white sticky top-0 z-20 shadow-sm">
                        <div className="flex justify-between items-end">
                            <div>
                                <h1 className="serif text-2xl font-bold tracking-tight text-[#bc002d]">2026 Osaka Trip</h1>
                                <p className="text-xs text-gray-400 font-bold tracking-widest uppercase">大阪 ● 京都 ● 兵庫</p>
                            </div>
                            <div className="text-right">
                                <span className="text-xs block text-gray-400">Feb 02 - Feb 06</span>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {activeTab === 'itinerary' && (
                            <div className="p-4 animate-fadeIn">
                                {/* 日期切換 */}
                                <div className="flex overflow-x-auto no-scrollbar mb-6 space-x-3 py-2">
                                    {TRIP_DATA.map((day, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => setActiveDay(idx)}
                                            className={`flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center transition-all ${
                                                activeDay === idx ? 'bg-[#bc002d] text-white shadow-lg scale-105' : 'bg-white text-gray-400'
                                            }`}
                                        >
                                            <span className="text-[10px] font-bold">DAY</span>
                                            <span className="text-xl font-bold leading-none">{idx + 1}</span>
                                            <span className="text-[10px] mt-1">{day.date.split('(')[1].replace(')', '')}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* 即時天氣 Mock (Tenki.jp 樣式) */}
                                <div className="glass-card p-4 mb-6 border-none bg-gradient-to-br from-blue-400 to-blue-500 text-white">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <p className="text-xs opacity-80">{TRIP_DATA[activeDay].location} - 預報</p>
                                            <p className="text-2xl font-bold">6°C <span className="text-sm font-normal">晴れ</span></p>
                                        </div>
                                        <div className="text-right">
                                            <i data-lucide="sun" className="w-8 h-8"></i>
                                        </div>
                                    </div>
                                    <div className="flex justify-between mt-4 text-[10px] border-t border-white/20 pt-2">
                                        {['09h', '12h', '15h', '18h', '21h'].map(h => (
                                            <div key={h} className="text-center">
                                                <div>{h}</div>
                                                <div className="font-bold">5°C</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 行程列表 */}
                                {TRIP_DATA[activeDay].items.map((item, i) => (
                                    <ItineraryCard key={i} item={item} />
                                ))}
                            </div>
                        )}

                        {activeTab === 'accounting' && (
                            <div className="p-6">
                                <h2 className="serif text-xl font-bold mb-4">旅行記帳</h2>
                                <div className="glass-card p-4">
                                    <label className="block text-xs font-bold text-gray-400 mb-1">項目名稱</label>
                                    <input type="text" className="w-full mb-4 p-2 border-b" placeholder="例如：力丸燒肉" />
                                    <label className="block text-xs font-bold text-gray-400 mb-1">金額 (JPY)</label>
                                    <input type="number" className="w-full mb-4 p-2 border-b" placeholder="¥ 0" />
                                    <label className="block text-xs font-bold text-gray-400 mb-1">支付方式</label>
                                    <div className="flex space-x-2 mb-6">
                                        {['現金', '刷卡', 'Suica'].map(m => (
                                            <button key={m} className="px-3 py-1 rounded-full border text-xs">{m}</button>
                                        ))}
                                    </div>
                                    <button className="w-full py-3 bg-stone-800 text-white rounded-xl font-bold shadow-lg">同步至 Google Sheet</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'shopping' && (
                            <div className="p-6">
                                <h2 className="serif text-xl font-bold mb-4">代購清單</h2>
                                <div className="space-y-3">
                                    <div className="glass-card p-3 flex items-center justify-between">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-4 h-4 border-2 rounded border-stone-300"></div>
                                            <div>
                                                <p className="text-sm font-bold">Onitsuka Tiger Mexico 66</p>
                                                <p className="text-[10px] text-gray-400">地點：臨空城 Outlet</p>
                                            </div>
                                        </div>
                                        <span className="text-xs text-[#bc002d] font-bold">¥12,000</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 底部導航 */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md bottom-nav px-6 pb-6 pt-3 flex justify-around items-center">
                        <button onClick={() => setActiveTab('itinerary')} className={`flex flex-col items-center ${activeTab==='itinerary'?'text-[#bc002d]':'text-gray-300'}`}>
                            <i data-lucide="map" className="w-6 h-6"></i>
                            <span className="text-[10px] mt-1 font-bold">行程</span>
                        </button>
                        <button onClick={() => setActiveTab('accounting')} className={`flex flex-col items-center ${activeTab==='accounting'?'text-[#bc002d]':'text-gray-300'}`}>
                            <i data-lucide="wallet" className="w-6 h-6"></i>
                            <span className="text-[10px] mt-1 font-bold">記帳</span>
                        </button>
                        <button onClick={() => setActiveTab('shopping')} className={`flex flex-col items-center ${activeTab==='shopping'?'text-[#bc002d]':'text-gray-300'}`}>
                            <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                            <span className="text-[10px] mt-1 font-bold">代購</span>
                        </button>
                        <button onClick={() => setActiveTab('docs')} className={`flex flex-col items-center ${activeTab==='docs'?'text-[#bc002d]':'text-gray-300'}`}>
                            <i data-lucide="file-text" className="w-6 h-6"></i>
                            <span className="text-[10px] mt-1 font-bold">文件</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</body>
</html>
